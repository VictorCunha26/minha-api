# ─────────────────────────────────────────────────────────────
# Pipeline completo: Testes → Imagem no Docker Hub → Deploy na EC2
# ─────────────────────────────────────────────────────────────
name: CI-CD FastAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── JOB 1: Testes ───────────────────────────────────────────
  Build:
    name: Compilar e Testar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  # ── JOB 2: Imagem no Docker Hub ─────────────────────────────
  Imagem:
    name: Construir e publicar imagem
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'      # PR não publica imagem
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:${{ github.sha }}

      - name: Resumo
        run: |
          echo "## ✅ Imagem publicada no Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- senai_fastapi:latest" >> $GITHUB_STEP_SUMMARY
          echo "- senai_fastapi:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ── JOB 3: Deploy na EC2 ────────────────────────────────────
  Deploy:
    name: Implantação AWS
    runs-on: ubuntu-latest
    needs: Imagem
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi
          CONTAINER: senai_fastapi
        with:
          host: ${{ secrets.EC2_HOST }}          # <- o Elastic IP
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER
          script: |
            set -e
            sudo docker pull $IMAGE:latest
            sudo docker stop $CONTAINER 2>/dev/null || true
            sudo docker rm   $CONTAINER 2>/dev/null || true
            sudo docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p 8080:8080 \
              $IMAGE:latest
            sleep 5
            curl -f http://localhost:8080/health
            echo "✅ Deploy concluído com sucesso!"
            sudo docker image prune -f